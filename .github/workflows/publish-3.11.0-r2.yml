name: Publish Modmail 3.11.0-r2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream v3.11.0
        shell: bash
        run: git clone --depth 1 --branch v3.11.0 --single-branch https://github.com/Dragory/modmailbot.git upstream

      - name: Resolve metadata
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node_major="$(grep -oE '[0-9]+' <<<"$(jq -r '.engines.node // empty' upstream/package.json)" | head -n 1)"
          revision="$(git -C upstream rev-parse HEAD)"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "node_major=$node_major" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and verify image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg "NODE_VERSION=${{ steps.build.outputs.node_major }}" \
            --build-arg "MODMAIL_VERSION=3.11.0" \
            --build-arg "UPSTREAM_REVISION=${{ steps.build.outputs.revision }}" \
            --build-arg "BUILD_DATE=${{ steps.build.outputs.build_date }}" \
            --tag ghcr.io/gtaodiscord/modmailbot:3.11.0-r2 .
          pwsh ./tests/verify-image.ps1 \
            -Image ghcr.io/gtaodiscord/modmailbot:3.11.0-r2 \
            -Version 3.11.0 \
            -Revision '${{ steps.build.outputs.revision }}'

      - name: Publish image and aliases
        shell: bash
        run: |
          set -euo pipefail
          docker push ghcr.io/gtaodiscord/modmailbot:3.11.0-r2
          docker tag ghcr.io/gtaodiscord/modmailbot:3.11.0-r2 ghcr.io/gtaodiscord/modmailbot:3.11
          docker tag ghcr.io/gtaodiscord/modmailbot:3.11.0-r2 ghcr.io/gtaodiscord/modmailbot:3
          docker tag ghcr.io/gtaodiscord/modmailbot:3.11.0-r2 ghcr.io/gtaodiscord/modmailbot:latest
          docker push ghcr.io/gtaodiscord/modmailbot:3.11
          docker push ghcr.io/gtaodiscord/modmailbot:3
          docker push ghcr.io/gtaodiscord/modmailbot:latest

      - name: Verify published manifest
        shell: bash
        run: docker manifest inspect ghcr.io/gtaodiscord/modmailbot:3.11.0-r2 >/dev/null
